name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    # Progression drafts use local review until the owner starts preview validation.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || !github.event.pull_request.draft ||
      (!startsWith(github.head_ref, 'feat/progression-') && !startsWith(github.head_ref, 'codex/progression-')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: github.event.action != 'closed'

      - name: Build static Lab preview
        if: github.event.action != 'closed'
        run: npm run preview:build
        env:
          GE_REVISION: ${{ github.event.pull_request.head.sha }}
          GE_PREVIEW_PR: ${{ github.event.number }}
          GE_DEPLOYMENT_CHANNEL: preview
          GE_DEPLOYMENT_LABEL: pr-${{ github.event.number }}

      - name: Deploy or remove PR preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: .preview-dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          comment: true
          qr-code: false
          wait-for-pages-deployment: false

      - name: Verify exact-head preview is live
        if: github.event.action != 'closed'
        shell: bash
        run: |
          preview_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/"
          expected_revision="${{ github.event.pull_request.head.sha }}"

          for attempt in {1..60}; do
            body="$(curl --fail --silent --show-error --location --max-time 10 "$preview_url" 2>/dev/null || true)"
            if grep -Fq "guitar-explorer-revision" <<<"$body" && grep -Fq "$expected_revision" <<<"$body"; then
              echo "Exact-head preview is live: $preview_url"
              exit 0
            fi
            echo "Waiting for Pages to publish exact revision (attempt $attempt/60)..."
            sleep 2
          done

          echo "::error::GitHub Pages did not publish the exact PR head at $preview_url"
          exit 1
